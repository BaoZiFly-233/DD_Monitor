# ruff 配置（独立文件，避免 pyproject.toml 自动发现不一致）
line-length = 160
target-version = "py311"
exclude = ["blivedm", "__pycache__", "docs", "cache"]

[lint]
select = ["E", "F", "W"]
# E402: DD监控室.py 顶部刻意先启用 faulthandler / Windows SetErrorMode 再 import，
#       以保证崩溃捕获在任何业务模块加载前生效，属于有意为之。
[lint.per-file-ignores]
"DD监控室.py" = ["E402"]
